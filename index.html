<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Daily Pulse - Breaking & Trending News</title>
  <meta name="description" content="Get the latest trending news and stories across the United States.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f5f7; color: #172b4d; line-height: 1.6; }
    header { background: #091e42; color: #fff; padding: 32px 20px; text-align: center; border-bottom: 4px solid #0052cc; }
    header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; }
    header p { color: #b3d4ff; margin-top: 6px; font-size: 1rem; }
    main { max-width: 860px; margin: 30px auto; padding: 0 16px; }
    .news-grid { display: flex; flex-direction: column; gap: 18px; }
    .news-card { background: #fff; padding: 22px; border-radius: 8px; box-shadow: 0 2px 6px rgba(9,30,66,0.08); transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .news-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(9,30,66,0.12); }
    .news-card a { font-size: 1.35rem; font-weight: 700; color: #0052cc; text-decoration: none; display: inline-block; line-height: 1.3; }
    .news-card a:hover { text-decoration: underline; }
    .news-date { font-size: 0.82rem; color: #6b778c; margin: 8px 0 10px 0; display: block; font-weight: 500; }
    .news-snippet { color: #42526e; font-size: 0.95rem; }
    .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
    .tag { background: #ebecf0; color: #42526e; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    footer { text-align: center; padding: 40px 20px; color: #6b778c; font-size: 0.85rem; }
    .loading { text-align: center; padding: 40px; font-size: 1.1rem; color: #6b778c; }
  </style>
</head>
<body>
  <header>
    <h1>US Daily Pulse</h1>
    <p>Automated Real-Time News & Analysis</p>
  </header>

  <main>
    <div id="posts" class="news-grid">
      <div class="loading">Loading latest news articles...</div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 US Daily Pulse. Real-time trend aggregator.</p>
  </footer>

  <script>
    fetch('/posts/index.json')
      .then(res => {
        if (!res.ok) throw new Error('Data not ready');
        return res.json();
      })
      .then(posts => {
        const container = document.getElementById('posts');
        if (!posts || posts.length === 0) {
          container.innerHTML = '<div class="news-card"><p>No news available yet. Check back shortly!</p></div>';
          return;
        }

        container.innerHTML = posts.map(p => {
          const dateStr = p.date ? new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
          const tagsHtml = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
          return `
            <article class="news-card">
              <a href="/post.html?slug=${p.slug}">${p.title}</a>
              <span class="news-date">${dateStr}</span>
              <p class="news-snippet">${p.snippet || ''}</p>
              <div class="tags">${tagsHtml}</div>
            </article>
          `;
        }).join('');
      })
      .catch(() => {
        document.getElementById('posts').innerHTML = '<div class="news-card"><p>Welcome! Our automated bot will fetch the latest US news shortly.</p></div>';
      });
  </script>
</body>
</html>
