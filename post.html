<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="doc-title">US News Article</title>
  <meta name="robots" content="index, follow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, 'Times New Roman', Times, serif; background-color: #f9f9f9; color: #1a1a1a; line-height: 1.8; }
    .container { max-width: 780px; margin: 0 auto; padding: 24px 18px; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.03); }
    .nav-top { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin-bottom: 24px; }
    .nav-top a { color: #0052cc; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
    .nav-top a:hover { text-decoration: underline; }
    h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 2.2rem; line-height: 1.3; color: #091e42; margin-bottom: 12px; }
    .meta-info { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.85rem; color: #6b778c; margin-bottom: 20px; border-bottom: 1px solid #ebecf0; padding-bottom: 12px; }
    .article-body { font-size: 1.12rem; color: #222; }
    .article-body p { margin-bottom: 18px; }
    .article-body h2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 1.5rem; margin: 26px 0 12px; color: #091e42; }
    .article-body h3 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 1.25rem; margin: 20px 0 10px; color: #172b4d; }
    .article-body ul { margin: 12px 0 18px 24px; }
    .article-body li { margin-bottom: 8px; }
    .ad-box { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; border: 1px dashed #c1c7d0; text-align: center; padding: 24px; margin: 24px 0; color: #6b778c; font-size: 0.85rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-top">
      <a href="/">&larr; Back to Home</a>
    </div>

    <h1 id="article-title">Loading article...</h1>
    <div class="meta-info" id="article-meta"></div>

    <!-- SLOT IKLAN ADSTERRA (ATAS) -->
    <div class="ad-box">
      [Adsterra Banner Atas - Tempel Script Iklan di Sini]
    </div>

    <div class="article-body" id="article-content">
      <p>Fetching content...</p>
    </div>

    <!-- SLOT IKLAN ADSTERRA (BAWAH) -->
    <div class="ad-box">
      [Adsterra Banner Bawah - Tempel Script Iklan di Sini]
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    if (!slug) {
      window.location.href = '/';
    } else {
      fetch(`/posts/${slug}.json`)
        .then(res => {
          if (!res.ok) throw new Error('Not found');
          return res.json();
        })
        .then(post => {
          document.title = `${post.title} - US Daily Pulse`;
          document.getElementById('article-title').textContent = post.title;
          
          const pubDate = post.date ? new Date(post.date).toUTCString() : '';
          document.getElementById('article-meta').textContent = `Published: ${pubDate}`;
          document.getElementById('article-content').innerHTML = post.content;
        })
        .catch(() => {
          document.getElementById('article-title').textContent = 'Article Not Found';
          document.getElementById('article-content').innerHTML = '<p>The requested article could not be loaded. Please return to the homepage.</p>';
        });
    }
  </script>
</body>
</html>
